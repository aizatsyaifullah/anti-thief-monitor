<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anti-Theft Monitor</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    text-align: center;
    padding: 40px 20px;
    margin: 0;
    min-height: 100vh;
  }
  h1 { font-size: 1.6em; margin-bottom: 30px; }
  .card {
    background: #1e293b;
    border-radius: 16px;
    padding: 30px;
    max-width: 400px;
    margin: 0 auto;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
  }
  #status {
    font-size: 1.4em;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    transition: background 0.3s;
  }
  .safe { background: #14532d; color: #86efac; }
  .danger { background: #7f1d1d; color: #fca5a5; animation: pulse 1s infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }
  button {
    padding: 16px 32px;
    font-size: 1.1em;
    font-weight: bold;
    background: #dc2626;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    width: 100%;
  }
  button:hover { background: #b91c1c; }
  button:disabled { background: #475569; cursor: not-allowed; }
  #lastUpdate { margin-top: 15px; font-size: 0.85em; color: #94a3b8; }
</style>
</head>
<body>

  <h1>🚨 Anti-Theft Monitor</h1>
  <div class="card">
    <div id="status" class="safe">Menyemak status...</div>
    <button id="offBtn" onclick="offBuzzer()">OFF BUZZER</button>
    <div id="lastUpdate"></div>
  </div>

<script>
  // GANTI dengan konfigurasi Firebase projek anda
  // (Web API Key & Database URL dari Firebase Console -> Project Settings)
  const firebaseConfig = {
    apiKey: "AIzaSyATRvwTXGeplp5KaZ_RGkOPqw2pI6X9SIQ",
    authDomain: "anti-thief-app.firebaseapp.com",
    databaseURL: "https://anti-thief-app-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "anti-thief-app.firebasestorage.app",
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const statusEl = document.getElementById("status");
  const timeEl = document.getElementById("lastUpdate");
  const offBtn = document.getElementById("offBtn");

  // Padan dengan path dalam kod ESP32: /anti_theft/door_status ("OPEN" / "CLOSED")
  db.ref("/anti_theft/door_status").on("value", (snap) => {
    const status = snap.val();
    if (status === "OPEN") {
      statusEl.innerText = "⚠️ PINTU TERBUKA!";
      statusEl.className = "danger";
      offBtn.disabled = false;
    } else {
      statusEl.innerText = "✅ Pintu Selamat";
      statusEl.className = "safe";
      offBtn.disabled = true;
    }
  });

  // Padan dengan path: /anti_theft/timestamp (millis() dari ESP32 sejak boot)
  db.ref("/anti_theft/timestamp").on("value", (snap) => {
    if (snap.val()) {
      const saat = Math.floor(snap.val() / 1000);
      timeEl.innerText = "Amaran dicetus pada uptime ESP32: " + saat + "s";
    }
  });

  // Padan dengan path: /anti_theft/buzzer (boolean true/false)
  function offBuzzer() {
    db.ref("/anti_theft/buzzer").set(false);
  }
</script>

</body>
</html>
